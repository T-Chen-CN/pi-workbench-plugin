# 为什么这个仓库必须有 CI：
#
# 插件仓库独立之后，自举 Prompt 只注入仓库地址、不钉版本 —— 也就是
# `hermes plugins install <repo>` 装的是**默认分支最新提交**，`hermes plugins update`
# 也是直接跟 main。所以 main 一旦红了，下一次安装/跟版就装到一个半成品：
# main 必须一直是绿的，这个 workflow 就是那道门。
#
# 零依赖：插件是 stdlib-only（core/ 不许 import gateway/plugins，也不需要任何 pip 包），
# 所以这里不装依赖、不跑 pip，只跑 unittest + 编译检查。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 零依赖：插件是 stdlib-only（core/ 不许 import gateway/plugins，也不需要 pip 包）
      - run: python -m unittest discover -s tests -t . -v
      - name: 全仓编译一遍（抓语法/编码问题）
        run: python -m compileall -q .
      - name: 确认没有 .pyc 被跟踪
        run: |
          if git ls-files | grep -q '__pycache__\|\.pyc$'; then
            echo '::error::__pycache__ 被提交了，先 git rm -r --cached'
            exit 1
          fi
